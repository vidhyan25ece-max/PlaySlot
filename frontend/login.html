<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlaySlot - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #111827, #2563eb);
        }

        .login-card {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .login-card label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .login-card input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d5dbe5;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .login-card input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">PlaySlot</div>

        <p class="subtitle">
            Sports Facility Booking
        </p>

        <form onsubmit="login(event)">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="studentA@iitg.ac.in"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script>

        const API_URL = "http://localhost:5000";

        async function login(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            try {

                const response = await fetch(
                    `${API_URL}/api/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    message.innerText =
                        data.error || "Login failed";

                    message.style.color = "#dc2626";

                    return;
                }

                // Save logged-in user
                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

                // Go to PlaySlot
                window.location.href = "index.html";

            } catch (error) {

                console.error("Login error:", error);

                message.innerText =
                    "Unable to connect to server.";

                message.style.color = "#dc2626";
            }
        }

    </script>

</body>

</html>
